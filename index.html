<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨境匯款小幫手</title>
  <meta name="description" content="比較各種跨境匯款方式的手續費、匯率與到帳時間 | Compare fees, rates and delivery times for international money transfers">
  <meta name="theme-color" content="#0b7a75">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="title-row">
        <h1 id="title">跨境匯款小幫手</h1>
        <span id="offline-badge" class="offline-badge" hidden></span>
        <button id="lang" type="button" class="lang"></button>
      </div>
      <p id="subtitle" class="subtitle"></p>

      <form id="search" class="search" autocomplete="off">
        <label class="field">
          <span id="from-label"></span>
          <select id="from"></select>
        </label>
        <button id="swap" type="button" class="swap">⇄</button>
        <label class="field">
          <span id="to-label"></span>
          <select id="to"></select>
        </label>
        <label class="field amount-field">
          <span id="amount-label"></span>
          <input id="amount" type="text" inputmode="numeric" value="100,000">
        </label>
      </form>
    </div>
  </header>

  <main class="wrap">
    <p id="rate-line" class="rate-line"></p>
    <p id="route-note" class="route-note" hidden></p>

    <section id="list-view">
      <div id="filters" class="filters" role="group"></div>
      <div id="sorts" class="sorts" role="tablist"></div>
      <ol id="results" class="results"></ol>
    </section>

    <section id="detail-view" hidden></section>

    <footer class="disclaimer">
      <p id="disclaimer-text"></p>
      <p id="foot1"></p>
      <p id="foot2"></p>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="data.en.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
