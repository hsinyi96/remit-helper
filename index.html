<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨境匯款小幫手</title>
  <meta name="description" content="比較各種跨境匯款方式的手續費、匯率與到帳時間">
  <meta name="theme-color" content="#0b7a75">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="title-row">
        <h1>跨境匯款小幫手</h1>
        <span id="offline-badge" class="offline-badge" hidden>離線中</span>
      </div>
      <p class="subtitle">一次比較所有匯款方式，找出最適合你的那一種</p>

      <form id="search" class="search" autocomplete="off">
        <label class="field">
          <span>從</span>
          <select id="from"></select>
        </label>
        <button id="swap" type="button" class="swap" aria-label="對調匯出與匯入的國家" title="對調">⇄</button>
        <label class="field">
          <span>匯到</span>
          <select id="to"></select>
        </label>
        <label class="field amount-field">
          <span id="amount-label">匯出金額（新台幣）</span>
          <input id="amount" type="text" inputmode="numeric" value="100,000">
        </label>
      </form>
    </div>
  </header>

  <main class="wrap">
    <p id="rate-line" class="rate-line"></p>
    <p id="route-note" class="route-note" hidden></p>

    <section id="list-view">
      <div id="filters" class="filters" role="group" aria-label="匯款用途"></div>
      <div id="sorts" class="sorts" role="tablist" aria-label="排序方式"></div>
      <ol id="results" class="results"></ol>
    </section>

    <section id="detail-view" hidden></section>

    <footer class="disclaimer">
      <p id="disclaimer-text"></p>
      <p>
        本頁的手續費、匯率與到帳時間是<strong>參考值</strong>（<span id="updated"></span>整理），
        不是即時資料，實際金額以各銀行與業者公告為準。每種方式的數字來源寫在各自的「詳細資訊」裡。
      </p>
      <p>目前只能查「台灣匯出」和「匯回台灣」的路線。總成本一律換算成新台幣顯示。「最多人用」是估計的排名。本站會匿名記錄使用情形（查詢的路線與金額、點選的項目），用來改善服務，不會記錄姓名或聯絡方式。留言是公開的，所有人都看得到，請不要留下個人資料。</p>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
